[package]
name = "argentum-engine-reference"
description = "Today's app code, compiled verbatim outside the app: the yardstick the engine's parity tests measure against."
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The colour constants and curves the app files import (`argentum_engine::colour`).
argentum-engine = { path = ".." }
# sharpen.rs names `tauri::AppHandle` in one function the tests never call.
tauri = { package = "argentum-engine-tauri-stub", path = "tauri-stub" }
rawler = { git = "https://github.com/akhater/RapidRAW-DngLab.git", rev = "dc8b144ace0de9b519ce2812f505028684be6fa6" }
wgpu = "29.0"
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25.10", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
# white_balance.rs and raw_processing.rs, as the app builds them.
glam = "0.33.5"
anyhow = "1.0.104"
