name: DirectX 12

# The shaders through DirectX 12, as every Windows PC without Vulkan runs
# them. wgpu translates WGSL to HLSL and FXC, the HLSL compiler built into
# Windows, compiles that when a pipeline is created. FXC refuses some shaders
# that Vulkan and OpenGL accept: 26.43.1's main shader failed to build with
# "unable to unroll loop" (X3511) on DirectX 12 only.
#
# The runner has no graphics card, so DirectX gives it WARP, Microsoft's
# software adapter, which ships with Windows. wgpu's own CI runs its DirectX 12
# tests on WARP too (gfx-rs/wgpu .github/workflows/ci.yml, gpu-test). Their
# runs pick DXC; this one pins FXC, the compiler the app gets, because it ships
# no dxcompiler.dll.
#
# Runs only when a file that goes into a GPU pipeline changes: the shaders, the
# files that build the pipelines, and the one that composes the main shader.
# GPU modules are matched by name (`*gpu*.rs`); any other file that builds a
# shader module or pipeline needs its path added here.
# A wgpu update is worth a run by hand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - 'src-tauri/**/*.wgsl'
      - 'src-tauri/**/*gpu*.rs'
      - 'src-tauri/engine/src/pixels/**'
      - 'src-tauri/engine/src/tools/rr_basic_tone/**'
      - 'src-tauri/engine/tests/common/app_shader.rs'
      - 'src-tauri/engine/tests/parity_basic_tone.rs'
      - 'src-tauri/src/mods/camera_look.rs'
      - 'src-tauri/src/mods/export_precision.rs'
      - 'src-tauri/src/mods/film_lut.rs'
      - 'src-tauri/src/mods/input_stage.rs'
      - 'src-tauri/src/mods/look_check/**'
      - 'src-tauri/src/mods/look_grain.rs'
      - 'src-tauri/src/mods/shader_check.rs'
      - '.github/workflows/dx12.yml'
  pull_request:
    paths:
      - 'src-tauri/**/*.wgsl'
      - 'src-tauri/**/*gpu*.rs'
      - 'src-tauri/engine/src/pixels/**'
      - 'src-tauri/engine/src/tools/rr_basic_tone/**'
      - 'src-tauri/engine/tests/common/app_shader.rs'
      - 'src-tauri/engine/tests/parity_basic_tone.rs'
      - 'src-tauri/src/mods/camera_look.rs'
      - 'src-tauri/src/mods/export_precision.rs'
      - 'src-tauri/src/mods/film_lut.rs'
      - 'src-tauri/src/mods/input_stage.rs'
      - 'src-tauri/src/mods/look_check/**'
      - 'src-tauri/src/mods/look_grain.rs'
      - 'src-tauri/src/mods/shader_check.rs'
      - '.github/workflows/dx12.yml'
  workflow_dispatch:

# A new push to a pull request cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: this workflow only checks out and reads the repository.
permissions:
  contents: read

jobs:
  warp:
    name: Shaders on DirectX 12 (WARP)
    runs-on: windows-latest
    env:
      WGPU_DX12_COMPILER: fxc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          rust-src-dir: src-tauri

      # Noise Reduction, sharpening after it, a mask's own Sharpen and the
      # whole render (main shader, blur, flare, guided filter) on every backend
      # the machine has. Here that is WARP; the others say they are not on
      # this machine.
      - name: Every backend we offer
        working-directory: src-tauri
        run: cargo test --lib mods::sharpen_gpu::tests::every_backend_we_offer -- --ignored --exact --nocapture
