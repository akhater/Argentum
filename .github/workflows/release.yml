name: 'Release: Build & Package App'

# The only definition of the eight desktop builds. Creating a release runs it and attaches every
# installer; run it by hand from the Actions tab to build them all without a release (each
# build's files are kept as an artifact for 7 days). Fast checks run on every push in lint.yml,
# app.yml and engine.yml.
on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: ''
            asset-prefix: '01'
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            asset-prefix: '01'
          - platform: 'macos-15'
            target: aarch64-apple-darwin
            asset-prefix: '02'
          - platform: 'macos-15-intel'
            target: x86_64-apple-darwin
            asset-prefix: '02'
          - platform: 'ubuntu-22.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-22.04-arm'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04'
            target: ''
            asset-prefix: '03'
          - platform: 'ubuntu-24.04-arm'
            target: ''
            asset-prefix: '03'
    uses: ./.github/workflows/build.yml
    with:
      release-id: ${{ github.event.release.id }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      asset-name-pattern: '[name]_v[version]_[platform]_[arch][ext]'
      asset-prefix: ${{ matrix.asset-prefix }}
    secrets: inherit
    permissions:
      contents: write

  # Once every installer is attached, the notes open with the Download table
  # (scripts/release-downloads.mjs). A failed build skips this, so a release
  # never links a file that is not there.
  downloads:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download table
        run: node scripts/release-downloads.mjs "${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Each installer against the same file of the release before: one that grew by more than 3%
  # fails this job until the notes say why, in a line starting "Installer size:"; then re-run it
  # (scripts/installer-size.mjs). North star 7: installer size is the smoke alarm.
  installer-size:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer size against the last release
        run: node scripts/installer-size.mjs "${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
