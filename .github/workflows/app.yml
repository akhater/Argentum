name: App

# The app crate's unit tests (src-tauri, `cargo test --lib`). lint.yml only
# lints this crate and engine.yml tests the engine, so until this ran, nothing
# in CI ran them - among them the GPU-free shader guards in
# mods/shader_check.rs, which compile every shader with naga and fail the
# patterns FXC, DirectX 12's compiler, cannot build.
#
# The tests that need a GPU or test photos are #[ignore]d and skipped there;
# the GPU-only ones, the golden photos and the FlashRaw check run after them,
# on the same build and a software GPU (see below). dx12.yml runs the shaders
# on DirectX 12.
on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: App unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''
          rust-src-dir: src-tauri

      # The packages the app crate builds with (.github/actions/app-system-deps).
      - name: Install system dependencies
        uses: ./.github/actions/app-system-deps

      - name: Test
        working-directory: src-tauri
        env:
          AG_REQUIRE_HEIC: '1'
        run: cargo test --lib

      # THE GOLDEN PHOTOS (src-tauri/src/mods/look_check.rs): ten CC0 RAWs
      # from raw.pixls.us through the app's own decode and render, held to the
      # text references in src-tauri/tests/look/. They run on every pull
      # request that changes something under src-tauri/, and a case that moved
      # fails this required job: bless it in the same pull request
      # (AG_LOOK_BLESS, a row in LEDGER.tsv) when the change is meant, by hand
      # or with golden-bless.yml, which blesses here, where the samples are.
      - name: Golden photos - anything to check?
        id: look-scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --quiet "$BASE" HEAD -- src-tauri; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "## Golden photos: SKIPPED - nothing under src-tauri/ changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # The ledger is append-only: the base's rows, unchanged, come first.
          ledger=src-tauri/tests/look/LEDGER.tsv
          if git show "$BASE:$ledger" > "$RUNNER_TEMP/ledger.base" 2>/dev/null; then
            size=$(wc -c < "$RUNNER_TEMP/ledger.base")
            if ! head -c "$size" "$ledger" | cmp -s - "$RUNNER_TEMP/ledger.base"; then
              echo "::error file=$ledger::LEDGER.tsv is append-only: a row of the base branch was changed or removed"
              echo "ledger=changed" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The samples, cached or fetched and checked, and a software GPU
      # (.github/actions/golden-samples). golden-bless.yml uses the same.
      - name: Golden photos - samples
        id: look-samples
        if: steps.look-scope.outputs.run == 'true'
        uses: ./.github/actions/golden-samples

      # A check that was due must not pass by not running: with a sample
      # missing (raw.pixls.us down and the cache cold) this job fails.
      - name: Golden photos - samples present
        if: steps.look-scope.outputs.run == 'true' && steps.look-samples.outputs.ok != 'true'
        run: |
          echo "::error::golden photos: the samples could not be fetched from raw.pixls.us, so the check did not run. Re-run this job once the host is back."
          exit 1

      - name: Golden photos
        if: steps.look-samples.outputs.ok == 'true'
        working-directory: src-tauri
        timeout-minutes: 30
        env:
          WGPU_BACKEND: vulkan
          AG_LOOK_SUMMARY: ${{ github.step_summary }}
          LEDGER_CHANGED: ${{ steps.look-scope.outputs.ledger }}
        run: |
          export AG_LOOK_SAMPLES="$HOME/look-samples"
          if [ "$LEDGER_CHANGED" = "changed" ]; then
            echo "::error::golden photos: LEDGER.tsv is append-only"
            exit 1
          fi
          # The test binary the step above built, run as cargo runs it. Through
          # cargo it would compile the app crate again (about a minute): the
          # first build's build script downloads the ONNX runtime into
          # resources/, which the next build then sees as changed.
          bin=$(ls -t target/debug/deps/argentum_lib-* 2>/dev/null | grep -v '\.d$' | head -n 1)
          if [ -x "$bin" ]; then
            "$bin" mods::look_check::golden_photos --ignored --exact --nocapture
          else
            cargo test --lib mods::look_check::golden_photos -- --ignored --exact --nocapture
          fi

      # The RAW decoder setting: on every sample FlashRaw decodes, its image
      # must be rawler's, field for field and sample for sample, or choosing
      # FlashRaw would change how photos look (src-tauri/src/mods/raw_decoder.rs).
      - name: FlashRaw gives rawler's image
        if: steps.look-samples.outputs.ok == 'true'
        working-directory: src-tauri
        timeout-minutes: 10
        run: |
          export AG_LOOK_SAMPLES="$HOME/look-samples"
          bin=$(ls -t target/debug/deps/argentum_lib-* 2>/dev/null | grep -v '\.d$' | head -n 1)
          if [ -x "$bin" ]; then
            "$bin" mods::raw_decoder::tests::flashraw_gives_rawlers_image --ignored --exact --nocapture
          else
            cargo test --lib mods::raw_decoder::tests::flashraw_gives_rawlers_image -- --ignored --exact --nocapture
          fi

      # THE GPU-ONLY TESTS (src-tauri/src/mods/gpu_tests.rs): the #[ignore]d
      # tests that need a GPU and nothing else, on the software GPU the samples
      # step installed. A test is in the set when its path contains `::gpu_`
      # and it carries the one shared ignore reason, which a unit test in
      # the lib tests keeps together: a new GPU-only test written that way runs here without
      # this file changing. One at a time (--test-threads=1): two of the sharpen_gpu
      # tests are written to be run that way, and gpu_tests.rs documents the
      # same command.
      #
      # Left out by name: a test that passes on a real GPU and cannot pass on a
      # software one. Each is listed here with its reason; none so far.
      - name: GPU tests
        if: steps.look-samples.outputs.ok == 'true'
        working-directory: src-tauri
        timeout-minutes: 25
        env:
          WGPU_BACKEND: vulkan
        run: |
          bin=$(ls -t target/debug/deps/argentum_lib-* 2>/dev/null | grep -v '\.d$' | head -n 1)
          if [ -x "$bin" ]; then
            "$bin" --ignored ::gpu_ --test-threads=1
          else
            cargo test --lib -- --ignored ::gpu_ --test-threads=1
          fi
