name: Lint

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels the run it replaces; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: this workflow only checks out and reads the repository.
permissions:
  contents: read

jobs:
  frontend-lint:
    name: Frontend Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The release builds' Node (.nvmrc, also read by build.yml); i18next-cli needs 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Every call the interface makes reaches a command, every shortcut a
      # handler; dependency counts and the built size against
      # scripts/wiring-baseline.json, so a removal or a new package shows.
      - name: Wiring, dependencies and size
        run: npm run check:wiring -- --dist

      - name: Tests
        run: npm run test:frontend

      # Types, lint and formatting against scripts/frontend-baseline.json:
      # nothing may get worse than main already was.
      - name: Types, lint and formatting
        run: npm run check:frontend

      # Every key the code uses in every locale, with each language's plural forms and the
      # English placeholders, against scripts/i18n-baseline.json: nothing may get worse.
      - name: Check Translation Sync
        run: npm run i18n:check

      # Today's interface in headless Chrome over a stub of the app: every
      # menu, tab, Settings section, context menu and default shortcut. Fails
      # on a page error, a raw translation key, or controls that differ from
      # scripts/ui-walk/ui-reachability.json.
      - name: UI walk
        run: npm run check:ui
        timeout-minutes: 15

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: rustfmt
          rustflags: ''
          rust-src-dir: src-tauri

      # Inherited files are not yet formatted; only src-tauri/src/mods/ is held.
      - name: Check formatting
        run: npm run check:fmt

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          components: clippy
          rustflags: ''
          rust-src-dir: src-tauri

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            libgphoto2-dev

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
